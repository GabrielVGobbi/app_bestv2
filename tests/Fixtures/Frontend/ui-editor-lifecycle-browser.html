<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' blob: data:; font-src 'none'"
        />
        <title>UI-007 — ciclo do editor</title>
        <style>
            body {
                margin: 18px;
                font:
                    15px system-ui,
                    sans-serif;
                background: var(--background);
                color: var(--foreground);
            }
            #app {
                max-width: 860px;
            }
            button {
                margin: 3px;
                cursor: pointer;
            }
            input,
            textarea {
                padding: 6px;
            }
            [role='dialog'] {
                position: fixed;
                inset: 10% 20%;
                z-index: 20;
                padding: 20px;
                background: var(--background);
                border: 1px solid var(--border);
                overflow: auto;
            }
            [data-slot='dialog-overlay'] {
                position: fixed;
                inset: 0;
                background: #0005;
            }
            #fixture-result {
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <button id="run-contracts" type="button">
            Executar regressões UI-007
        </button>
        <p>
            Editor e composer reais; imagens próprias e callbacks finitos, sem
            upload ou backend.
        </p>
        <pre id="fixture-result">Carregando.</pre>
        <div id="app"></div>
        <script type="module" src="./ui-editor-lifecycle-probe.tsx"></script>
    </body>
</html>
