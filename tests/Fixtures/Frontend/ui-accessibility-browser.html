<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' blob: data:; font-src 'none'"
        />
        <title>UI-009 — controles acessíveis</title>
        <style>
            body {
                margin: 18px;
            }
            #fixture-controls {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                padding: 12px;
                border: 1px solid var(--border);
            }
            #fixture-result,
            #focus-audit {
                white-space: pre-wrap;
                font: 12px monospace;
            }
            #app {
                max-width: 1000px;
                margin-top: 18px;
            }
        </style>
    </head>
    <body>
        <div id="fixture-controls">
            <button id="run-contracts" type="button">
                Executar regressões UI-009
            </button>
            <label
                >Cena de teclado
                <select id="manual-scene">
                    <option value="editors">Editores</option>
                    <option value="forms">Formulários</option>
                    <option value="composer">Comentário</option>
                    <option value="clipboard">Cópia</option>
                    <option value="design">CodeBlock real</option>
                    <option value="two-factor">Chave 2FA sintética</option>
                </select></label
            >
            <button id="prepare-manual" type="button">Preparar cena</button>
            <button id="toggle-theme" type="button">Alternar tema</button>
            <input
                id="keyboard-origin"
                aria-label="Origem de foco da fixture"
            />
        </div>
        <p>
            Componentes e CSS reais. Somente dados sintéticos, 422 controlado e
            Clipboard finito. Sem salvamento ou confirmação de 2FA.
        </p>
        <pre id="focus-audit">Aguardando foco.</pre>
        <pre id="fixture-result">Carregando.</pre>
        <div id="app"></div>
        <script type="module" src="./ui-accessibility-probe.tsx"></script>
    </body>
</html>
